<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>First to Emerald</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column. Banner verdict, then a race track (one lane per player, ticks per division, emerald finish), then two side-by-side player cards, then LP history. */
:root {
  --void: #050b14;        /* client background */
  --panel: #0c1724;
  --panel-2: #101e2e;
  --gold: #c8aa6e;
  --gold-dim: #6b5530;
  --text: #f0e6d2;
  --muted: #8a9aa8;
  --blue: #3fa7e0;        /* blue side */
  --red: #e84057;         /* red side */
  --emerald: #2bd18b;
  --line: #1f3043;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(ellipse 120% 60% at 50% -10%, #12263b 0%, var(--void) 60%) fixed, var(--void);
  isolation: isolate;
  color: var(--text);
  font: 500 16px/1.45 var(--body);
  padding: 28px 16px 48px;
  min-height: 100%;
}
.wrap { max-width: 880px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.duo > *, .cards > * { min-width: 0; }
a { color: var(--gold); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* Banner */
header { text-align: center; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; justify-items: center; }
.eyebrow { font: 600 13px var(--body); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
h1 {
  margin: 0; font: 800 clamp(34px, 7vw, 58px)/1.05 var(--display); letter-spacing: .04em;
  background: linear-gradient(180deg, #f0e6d2 10%, var(--gold) 60%, #8a6d3b 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-wrap: balance;
}
.rule { width: min(420px, 80%); height: 12px; position: relative; }
.rule::before { content: ""; position: absolute; inset: 5px 0; border-top: 1px solid var(--gold-dim); border-bottom: 1px solid var(--gold-dim); }
.rule::after { content: ""; position: absolute; left: 50%; top: 0; width: 12px; height: 12px; transform: translateX(-50%) rotate(45deg); background: var(--emerald); box-shadow: 0 0 12px var(--emerald); }
.verdict { font: 600 clamp(18px, 3.4vw, 24px) var(--body); text-wrap: balance; }
.verdict b { font-weight: 700; }

/* Hextech frame */
.frame { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--gold-dim); position: relative; padding: 22px 20px; }
.frame::before { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(200,170,110,.12); pointer-events: none; }
.frame h2 { margin: 0 0 16px; font: 600 14px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }

/* Race track */
.track { display: grid; gap: 18px; }
.lane { display: grid; grid-template-columns: 1fr; gap: 6px; }
.lane-label { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.lane-label .lp { font-variant-numeric: tabular-nums; color: var(--muted); }
.bar { position: relative; height: 38px; margin-block: 10px; background: #08121d; border: 1px solid var(--line); }
.bar .ticks { position: absolute; inset: 0; }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
.bar .fill::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 10px, rgba(255,255,255,.06) 10px 20px); }
.bar .tip { position: absolute; top: 50%; width: 64px; height: 64px; transform: translate(-50%, -50%); transition: left 1.2s cubic-bezier(.2,.8,.2,1); z-index: 2; }
.bar .tip img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 4px rgba(0,0,0,.6)); transform-origin: 50% 85%; animation: jitter 1.6s ease-in-out infinite; }
.lane:nth-child(2) .tip img { animation-duration: 1.35s; animation-delay: -.5s; }
@keyframes jitter { 0%, 100% { transform: rotate(-6deg); } 25% { transform: rotate(5deg) translateY(-1px); } 50% { transform: rotate(-4deg); } 75% { transform: rotate(6deg) translateY(-1px); } }
.bar .finish { position: absolute; right: -1px; top: -6px; bottom: -6px; width: 4px; background: var(--emerald); box-shadow: 0 0 10px var(--emerald); }
.scale { position: relative; height: 18px; font: 600 12px var(--body); color: var(--muted); letter-spacing: .06em; }
.scale span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.scale span.goal { color: var(--emerald); transform: translateX(-100%); }
.scale span:first-child { transform: none; }

/* Player cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.card { display: grid; gap: 14px; border-top: 3px solid var(--side); }
.card .who { display: flex; gap: 12px; align-items: center; min-width: 0; }
.card .who .face { position: relative; width: 64px; height: 64px; flex: none; }
.card .who .face > img { width: 100%; height: 100%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
.card .who .face > .champ { position: absolute; right: -4px; bottom: -2px; width: 24px; height: 24px; border: 1px solid var(--gold); }
.card .name { font: 700 22px/1.1 var(--display); letter-spacing: .02em; overflow-wrap: anywhere; }
.card .side { font: 600 12px var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--side); }
.card .rank { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card .rank .tier { font: 600 20px var(--display); }
.card .rank .lpbig { font: 700 40px/1 var(--body); font-variant-numeric: tabular-nums; }
.card .rank .lpbig small { font-size: 18px; color: var(--muted); margin-left: 3px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: #08121d; border: 1px solid var(--line); padding: 8px 10px; }
.stat dt { font: 600 11px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.stat dd { margin: 2px 0 0; font: 700 20px var(--body); font-variant-numeric: tabular-nums; }
.togo { color: var(--emerald); }
.card .opgg { font-size: 14px; justify-self: start; }
.leader-chip { font: 700 11px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--void); background: var(--gold); padding: 2px 8px; margin-left: auto; align-self: flex-start; }

/* History */
.chart-wrap { overflow-x: auto; }
svg text { font: 600 11px var(--body); fill: var(--muted); }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; }
.empty-note { color: var(--muted); margin: 0; }

/* Oracle + vote */
.duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.oracle .pick { display: flex; gap: 14px; align-items: center; }
.oracle .pick img { width: 72px; height: 72px; flex: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
.oracle .pick-label { font: 600 12px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.oracle .pick-name { font: 700 24px/1.1 var(--display); }
.oracle .headline { font: 600 20px/1.3 var(--body); margin: 16px 0 8px; text-wrap: balance; }
.oracle p { margin: 0 0 12px; color: #c9c3b4; max-width: 62ch; }
.meter { height: 10px; background: #08121d; border: 1px solid var(--line); display: flex; }
.meter > span { display: block; height: 100%; transition: width .8s ease; }
.meter-legend { display: flex; justify-content: space-between; gap: 8px; font: 600 14px var(--body); font-variant-numeric: tabular-nums; margin-top: 6px; }
.eta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.small { font-size: 13px; color: var(--muted); }
.prev-call { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.prev-call summary { cursor: pointer; font: 600 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.prev-call summary:hover { color: var(--gold); }
.prev-call .prev-body { margin-top: 10px; display: grid; gap: 6px; }
.prev-call .prev-body p { margin: 0; font-size: 15px; }
.vote-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.vote-btn { display: grid; justify-items: center; gap: 6px; padding: 12px 8px; background: #08121d; border: 1px solid var(--line); color: var(--text); font: 700 16px var(--body); cursor: pointer; transition: border-color .2s, transform .15s; }
.vote-btn img { width: 64px; height: 64px; }
.vote-btn:hover:not(:disabled) { border-color: var(--side); transform: translateY(-2px); }
.vote-btn:disabled { cursor: default; opacity: .55; }
.vote-btn.mine { opacity: 1; border-color: var(--side); box-shadow: 0 0 0 1px var(--side) inset; }
.vote-btn .cta { font: 600 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--side); }

/* Summoner's Rift jungle backdrop, darkened toward the middle so the panels stay readable */
.rift { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: url("img/jungle.jpg") center / cover no-repeat; }
.rift::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,11,20,.55), rgba(5,11,20,.35) 40%, rgba(5,11,20,.7)), radial-gradient(ellipse 60% 80% at 50% 50%, rgba(5,11,20,.55), transparent 80%); }
.frame { background: linear-gradient(180deg, rgba(16,30,46,.94), rgba(12,23,36,.94)); }
/* Champion renders: fixed at the sides on wide screens, flanking the title otherwise */
:root { --fh: min(68vh, 760px, calc(((100vw - 880px) / 2 - 90px) * 1.25)); }
.side-art { position: fixed; bottom: 4vh; height: var(--fh); aspect-ratio: 4 / 5; pointer-events: none; z-index: 0; animation: breathe 5s ease-in-out infinite; }
.side-art.left { right: calc(50% + 500px); }
.side-art.right { left: calc(50% + 500px); animation-delay: -2.5s; }
.side-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 24px rgba(0,0,0,.6)); animation: powershake .09s steps(2) infinite; }
.side-art.left img { object-position: bottom center; }
.side-art.right img { object-position: bottom center; }
.side-art canvas { position: absolute; left: -60px; right: -60px; top: -140px; bottom: 0; width: calc(100% + 120px); height: calc(100% + 140px); }
.side-art.surge img { animation-name: powersurge; }
/* the one behind: shrinks back, trembles, leans away from the leader */
.side-art.cower img { transform-origin: 50% 100%; filter: drop-shadow(0 10px 24px rgba(0,0,0,.6)) brightness(.8) saturate(.75); animation: cower-l .16s ease-in-out infinite alternate; }
.side-art.right.cower img { animation-name: cower-r; }
.side-art canvas.front { z-index: 1; }
.side-art.cower canvas { transform-origin: 50% 100%; animation: cower-l .16s ease-in-out infinite alternate; }
.side-art.right.cower canvas { animation-name: cower-r; }
@keyframes cower-l { from { transform: scale(.9) rotate(-4deg) translateX(-1.5px); } to { transform: scale(.89) rotate(-5deg) translateX(1.5px); } }
@keyframes cower-r { from { transform: scale(.9) rotate(4deg) translateX(-1.5px); } to { transform: scale(.89) rotate(5deg) translateX(1.5px); } }
.hero-art.cower { animation: none !important; filter: drop-shadow(0 6px 12px rgba(0,0,0,.6)) brightness(.8) saturate(.75); }

/* chat bubbles over their heads */
.bubble { position: fixed; bottom: calc(4vh + var(--fh) + 26px); z-index: 2; max-width: min(300px, calc((100vw - 880px) / 2 - 40px)); width: max-content;
  padding: 10px 14px; background: var(--text); color: #0b1520; font: 700 16px/1.3 var(--body); border-radius: 16px; border: 2px solid var(--side);
  box-shadow: 0 6px 18px rgba(0,0,0,.5), 0 0 18px color-mix(in srgb, var(--side) 45%, transparent);
  opacity: 0; transform: translateY(8px) scale(.85); transition: opacity .25s ease, transform .3s cubic-bezier(.3,1.6,.5,1); pointer-events: none; text-wrap: balance; }
.bubble.left { right: calc(50% + 500px + var(--fh) * .4 - min(150px, (100vw - 880px) / 4 - 20px)); }
.bubble.right { left: calc(50% + 500px + var(--fh) * .4 - min(150px, (100vw - 880px) / 4 - 20px)); }
.bubble.show { opacity: 1; transform: none; }
.bubble::after { content: ""; position: absolute; bottom: -10px; left: 50%; margin-left: -9px; border: 9px solid transparent; border-bottom: 0; border-top-color: var(--side); }
.bubble .who { display: block; font: 600 11px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--side); margin-bottom: 2px; }
.bubble.meek { font-weight: 500; font-style: italic; font-size: 14px; background: #d9d3c4; }
.banter { display: none; min-height: 2.6em; font-size: 15px; color: #c9c3b4; text-align: center; max-width: 52ch; transition: opacity .3s; }
.banter b { color: var(--side); }
@media (max-width: 1279px) { .bubble { display: none; } .banter { display: block; } }
@keyframes powershake { 0% { transform: translate(0, 0); } 50% { transform: translate(.6px, -.6px); } 100% { transform: translate(-.6px, .4px); } }
@keyframes powersurge { 0% { transform: translate(-2px, 1px); } 50% { transform: translate(2px, -2px); } 100% { transform: translate(-1px, 2px); } }
.hero-art.left { animation: aura-blue 1.4s ease-in-out infinite; }
.hero-art.right { animation: aura-red 1.4s ease-in-out infinite -.7s; }
@keyframes aura-blue { 0%, 100% { filter: drop-shadow(0 0 4px #5cc8ff) drop-shadow(0 0 10px #3fa7e0); } 50% { filter: drop-shadow(0 0 8px #bfeaff) drop-shadow(0 0 20px #3fa7e0); } }
@keyframes aura-red { 0%, 100% { filter: drop-shadow(0 0 4px #ff6a7d) drop-shadow(0 0 10px #e84057); } 50% { filter: drop-shadow(0 0 8px #ffd0d6) drop-shadow(0 0 20px #e84057); } }
.wrap { position: relative; z-index: 1; }
.hero { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,2.6fr) minmax(0,1fr); grid-template-areas: "l h r"; align-items: end; gap: 8px; }
.hero > header { grid-area: h; min-width: 0; }
.hero-art.left { grid-area: l; }
.hero-art.right { grid-area: r; }
.hero-art { display: none; height: 210px; width: 100%; object-fit: contain; filter: drop-shadow(0 6px 12px rgba(0,0,0,.6)); }
.hero-art.left { object-position: bottom right; }
.hero-art.right { object-position: bottom left; }
@keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@media (min-width: 1280px) { .hero { display: block; } }
@media (max-width: 1279px) { .side-art { display: none; } .hero-art { display: block; } }
@media (max-width: 600px) { .hero { grid-template-columns: minmax(0,1fr) minmax(0,1fr); grid-template-areas: "l r" "h h"; } .hero-art { height: 170px; } .hero-art.left { object-position: bottom center; } .hero-art.right { object-position: bottom center; } }
@media (prefers-reduced-motion: reduce) { .side-art, .side-art img, .hero-art.left, .hero-art.right { animation: none; } }

footer { text-align: center; color: var(--muted); font-size: 14px; }
.legal { max-width: 70ch; margin: 10px auto 0; font-size: 12px; opacity: .75; text-wrap: balance; }

.winner { text-align: center; font: 800 clamp(22px, 5vw, 34px) var(--display); color: var(--emerald); text-shadow: 0 0 18px rgba(43,209,139,.5); }

@media (prefers-reduced-motion: reduce) { .bar .fill, .bar .tip { transition: none; } .bar .tip img { animation: none; } }
@media (max-width: 480px) { .frame { padding: 18px 14px; } .stat dd { font-size: 18px; } }
</style>
</head>

<div class="rift" aria-hidden="true"></div>
<div class="bubble left" id="bubble-blue" role="status" aria-live="polite"></div>
<div class="bubble right" id="bubble-red" role="status" aria-live="polite"></div>
<div class="side-art left" data-aura="#3fa7e0" data-hot="#bfeaff" data-eyes="0.411,0.066,0.443,0.063"><canvas aria-hidden="true"></canvas><img src="img/syrio-fiora.png" alt="Syrio Forel as Fiora"><canvas class="front" aria-hidden="true"></canvas></div>
<div class="side-art right" data-aura="#e84057" data-hot="#ffd0d6" data-eyes="0.537,0.048,0.569,0.048"><canvas aria-hidden="true"></canvas><img src="img/curry-lissandra.png" alt="AD Curry as Lissandra"><canvas class="front" aria-hidden="true"></canvas></div>
<div class="wrap">
  <div class="hero">
    <img class="hero-art left" src="img/syrio-fiora.png" alt="">
    <header>
      <div class="eyebrow">OCE · Ranked Solo/Duo</div>
      <h1>First to Emerald</h1>
      <div class="rule" aria-hidden="true"></div>
      <div class="verdict" id="verdict">Loading the ladder…</div>
      <div class="banter" id="banter" aria-live="polite"></div>
    </header>
    <img class="hero-art right" src="img/curry-lissandra.png" alt="">
  </div>

  <div id="winner" class="winner" hidden></div>

  <section class="frame" aria-labelledby="race-h">
    <h2 id="race-h">The race</h2>
    <div class="track" id="track"></div>
  </section>

  <section class="cards" id="cards"></section>

  <div class="duo">
    <section class="frame oracle" aria-labelledby="oracle-h">
      <h2 id="oracle-h">The Oracle predicts</h2>
      <div id="oracle"><p class="empty-note">The Oracle hasn't read the stats yet. Its first prediction shows up after the next update.</p></div>
    </section>
    <section class="frame" aria-labelledby="vote-h">
      <h2 id="vote-h">Who gets there first?</h2>
      <div id="vote"><p class="empty-note">Loading votes…</p></div>
    </section>
  </div>

  <section class="frame" aria-labelledby="hist-h">
    <h2 id="hist-h">LP over time</h2>
    <div class="chart-wrap" id="chart"></div>
  </section>

  <footer id="footer"></footer>

<script>
(function () {
  const data = JSON.parse(document.getElementById("race-data").textContent);
  const GOAL = data.goal;                       // Emerald IV, 0 LP
  const TIERS = ["Iron","Bronze","Silver","Gold","Platinum","Emerald","Diamond","Master"];
  const SHORT = { Iron:"I", Bronze:"B", Silver:"S", Gold:"G", Platinum:"P", Emerald:"E", Diamond:"D" };
  const ROMAN = { "1":"I", "2":"II", "3":"III", "4":"IV" };
  const SIDE = { blue: "var(--blue)", red: "var(--red)" };
  const P = data.players;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

  // Score is LP above Iron IV 0 LP: every division is 100 LP, every tier 400.
  function divLabel(score) {
    if (score >= GOAL) return "E4";
    const t = Math.floor(score / 400), d = 4 - Math.floor((score % 400) / 100);
    return SHORT[TIERS[t]] + d;
  }
  function rankText(p) { return p.tier === "Unranked" ? "Unranked" : p.tier + (p.div ? " " + ROMAN[p.div] : ""); }

  // Track runs from the lowest division anyone has touched (at least Plat IV) to Emerald IV.
  const scores = P.map(p => p.score).concat(P.flatMap(p => (p.hist || []).map(h => h.s)));
  const start = Math.min(1600, Math.floor(Math.min(...scores) / 100) * 100);
  const pct = s => Math.max(0, Math.min(100, (s - start) / (GOAL - start) * 100));

  const sorted = [...P].sort((a, b) => b.score - a.score);

  if (winner) { $("winner").hidden = false; $("winner").textContent = "Emerald reached. Race over."; }

  // Track

  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll(".fill").forEach(el => el.style.width = el.dataset.w + "%");
    document.querySelectorAll(".tip").forEach(el => el.style.left = el.dataset.l + "%");
  }));

  // Cards
  $("cards").innerHTML = P.map(p => {
    const games = p.wins + p.losses, wr = games ? Math.round(p.wins / games * 100) : 0;

      </dl>
      <a class="opgg" href="https://op.gg/lol/summoners/oce/${p.slug}" target="_blank" rel="noopener">View on op.gg ↗</a>
    </article>`;
  }).join("");

  // History chart: one line per player, each on its own timestamps
  const colors = { blue: "#3fa7e0", red: "#e84057" };
  const series = P.map(p => (p.hist || []).map(h => ({ t: +new Date(h.t), s: h.s })));
  const allPts = series.flat();
  if (series.every(sr => sr.length < 2)) {

  } else {
    const W = 820, Ht = 260, L = 40, R = 14, T = 12, B = 28;
    const t0 = Math.min(...allPts.map(q => q.t)), t1 = Math.max(...allPts.map(q => q.t));

    const fmt = d => new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short" });

    for (let d = new Date(t0).setHours(0, 0, 0, 0) + DAY; d < t1; d += step) {
      g += `<line x1="${x(d)}" x2="${x(d)}" y1="${T}" y2="${Ht - B}" stroke="#16263a" stroke-width="1"/>`;

    }
    P.forEach((p, i) => {
      const sr = series[i]; if (!sr.length) return;
      const pts = sr.map(q => [x(q.t).toFixed(1), y(q.s).toFixed(1)]);
      g += `<polyline points="${pts.map(q => q.join(",")).join(" ")}" fill="none" stroke="${colors[p.side]}" stroke-width="2.5" stroke-linejoin="round"/>`;
      pts.forEach(([cx, cy], j) => {
        const last = j === pts.length - 1;
        g += `<circle cx="${cx}" cy="${cy}" r="${last ? 5 : 3}" fill="${colors[p.side]}" stroke="#050b14" stroke-width="${last ? 2 : 1}"><title>${esc(p.name)}: ${divLabel(sr[j].s)} ${sr[j].s % 100} LP, ${fmt(sr[j].t)}</title></circle>`;
      });
    });
    $("chart").innerHTML = `<svg viewBox="0 0 ${W} ${Ht}" width="100%" style="min-width:520px" role="img" aria-label="LP history for both players">${g}</svg>
      <div class="legend">${P.map(p => `<span><i style="background:${colors[p.side]}"></i>${esc(p.name)}</span>`).join("")}<span class="small">Daily points from op.gg, plus every change this site sees</span></div>`;
  }

  // Oracle (AI prediction written by predict.py)
  const pr = data.prediction;
  if (pr) {
    const w = P.find(p => p.name === pr.winner) || P[0], other = P.find(p => p !== w);
    const when = new Date(pr.t).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
    $("oracle").innerHTML = `
      <div class="pick"><img src="${esc(w.photo || w.icon)}" alt="">
        <div><div class="pick-label">Predicted winner</div><div class="pick-name" style="color:${SIDE[w.side]}">${esc(w.name)}</div></div></div>
      <div class="headline">“${esc(pr.headline)}”</div>
      <p>${esc(pr.reasoning)}</p>
      <div class="meter" role="img" aria-label="${pr.confidence}% ${esc(w.name)}"><span style="width:${pr.confidence}%;background:${SIDE[w.side]}"></span><span style="width:${100 - pr.confidence}%;background:${SIDE[other.side]}"></span></div>
      <div class="meter-legend"><span style="color:${SIDE[w.side]}">${pr.confidence}%</span><span style="color:${SIDE[other.side]}">${100 - pr.confidence}%</span></div>
      <dl class="eta">${P.map(p => `<div class="stat"><dt>${esc(p.name)} ETA</dt><dd style="font-size:17px">${esc((pr.eta || {})[p.name] || "?")}</dd></div>`).join("")}</dl>
      <p class="small" style="margin:12px 0 0">Claude's read of the op.gg stats · ${when}</p>`;
    const old = data.prev_prediction;
    if (old) {
      const ow = P.find(p => p.name === old.winner) || P[0];
      const owhen = new Date(old.t).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
      $("oracle").insertAdjacentHTML("beforeend", `
        <details class="prev-call"><summary>Previous call · ${esc(ow.name)} ${old.confidence}%</summary>

            <p><b style="color:${SIDE[ow.side]}">${esc(ow.name)}</b> at ${old.confidence}% · “${esc(old.headline)}”</p>
            <p class="small">${esc(old.reasoning)}</p>
            <p class="small">ETA then: ${P.map(p => `${esc(p.name)} ${esc((old.eta || {})[p.name] || "?")}`).join(" · ")} · ${owhen}</p>
          </div></details>`);
    }
  }

  // Votes: one per browser, tallied on a public counter
  const VOTE_API = "https://abacus.jasoncameron.dev", VOTE_NS = "hoganchinery-emerald-race", VOTE_STORE = "emerald-vote";
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(VOTE_STORE)); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(VOTE_STORE, JSON.stringify(v)); } catch (e) {} }
  };
  let myVote = store.get(), counts = null, busy = false;
  function renderVotes(msg) {
    const total = counts ? P.reduce((n, p) => n + (counts[p.vote] || 0), 0) : 0;
    $("vote").innerHTML = `
      <div class="vote-btns">${P.map(p => `
        <button type="button" class="vote-btn${myVote && myVote.who === p.vote ? " mine" : ""}" data-key="${esc(p.vote)}" style="--side:${SIDE[p.side]}" ${myVote || !counts || busy ? "disabled" : ""}>
          <img src="${esc(p.photo || p.icon)}" alt="">${esc(p.name)}
          <span class="cta">${myVote && myVote.who === p.vote ? "Your pick" : myVote ? "" : "Vote"}</span>
        </button>`).join("")}</div>
      ${counts ? `<div class="meter" role="img" aria-label="Vote split">${P.map(p => `<span style="width:${total ? (counts[p.vote] || 0) / total * 100 : 50}%;background:${SIDE[p.side]}"></span>`).join("")}</div>
      <div class="meter-legend">${P.map(p => `<span style="color:${SIDE[p.side]}">${counts[p.vote] || 0} vote${counts[p.vote] === 1 ? "" : "s"}${total ? ` · ${Math.round((counts[p.vote] || 0) / total * 100)}%` : ""}</span>`).join("")}</div>` : ""}
      <p class="small" style="margin:12px 0 0">${msg || (myVote ? "Thanks, your vote is in. One vote per browser." : "One vote per browser. Choose wisely.")}</p>`;
    document.querySelectorAll(".vote-btn").forEach(b => b.addEventListener("click", () => castVote(b.dataset.key)));
  }
  async function loadVotes() {
    try {
      const vals = await Promise.all(P.map(p => fetch(`${VOTE_API}/get/${VOTE_NS}/${p.vote}`).then(r => r.ok ? r.json() : { value: 0 })));
      counts = Object.fromEntries(P.map((p, i) => [p.vote, vals[i].value || 0]));
      renderVotes();
    } catch (e) { renderVotes("Votes couldn't load. Refresh to try again."); }
  }
  async function castVote(key) {
    if (myVote || busy) return;
    busy = true; renderVotes("Casting your vote…");
    try {
      const r = await fetch(`${VOTE_API}/hit/${VOTE_NS}/${key}`);
      if (!r.ok) throw new Error(r.status);
      counts[key] = (await r.json()).value;
      myVote = { who: key, token: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)), t: Date.now() };
      store.set(myVote);
      busy = false; renderVotes();
    } catch (e) { busy = false; renderVotes("That vote didn't go through. Try again in a moment."); }
  }
  loadVotes();

  // Footer
  const upd = data.updated ? new Date(data.updated) : null;
  $("footer").innerHTML = (upd ? `Last checked ${upd.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })}` : "Not checked yet")
    + ` · Rank data from ${P.some(p => p.source === "riot") ? "Riot Games" : "op.gg"}`;
  // Roles: the leader is fully powered up, whoever's behind cowers
  const bySide = { left: P.find(p => p.side === "blue"), right: P.find(p => p.side === "red") };
  const leaderSide = gap === 0 ? null : (lead.side === "blue" ? "left" : "right");
  document.querySelectorAll(".side-art, .hero-art").forEach(el => {
    const sd = el.classList.contains("left") ? "left" : "right";
    el.dataset.power = !leaderSide || sd === leaderSide ? 1 : 0;
    el.classList.toggle("cower", !!leaderSide && sd !== leaderSide);
  });

  // Power-up auras: flames rise off each fighter's silhouette, with a pulsing glow and the odd lightning crackle
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll(".side-art").forEach(box => {
    const img = box.querySelector("img"), cv = box.querySelector("canvas:not(.front)"), ctx = cv.getContext("2d");
    const fv = box.querySelector("canvas.front"), tc = fv.getContext("2d");
    const color = box.dataset.aura, hot = box.dataset.hot, PADX = 60, PADT = 140, eyes = (box.dataset.eyes || "").split(",").map(Number).filter(n => !isNaN(n) && n > 0);
    let edges = [], glow = null, parts = [], sweat = [], bolt = null, nextBolt = 90, frame = 0, rect = null;
    const sprite = (c1, c2) => {
      const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
      const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, c1); gr.addColorStop(.35, c2); gr.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
    };
    const flame = sprite(hot, color), core = sprite("#ffffff", hot);
    function prep() {
      const h = 260, w = Math.round(img.naturalWidth * h / img.naturalHeight);
      const off = document.createElement("canvas"); off.width = w; off.height = h;
      const o = off.getContext("2d"); o.drawImage(img, 0, 0, w, h);
      try {
        const d = o.getImageData(0, 0, w, h).data, A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : d[(y * w + x) * 4 + 3];
        for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2)
          if (A(x, y) > 128 && (A(x - 3, y) < 64 || A(x + 3, y) < 64 || A(x, y - 3) < 64)) edges.push([x / w, y / h]);
      } catch (e) {}
      if (!edges.length) for (let i = 0; i < 200; i++) edges.push([Math.random(), Math.random() * .9]);
      // colored silhouette, blurred once up front, redrawn each frame as the glow
      glow = document.createElement("canvas"); const gw = w * 2 + 80, gh = h * 2 + 80;
      glow.width = gw; glow.height = gh; const gg = glow.getContext("2d");
      const tint = document.createElement("canvas"); tint.width = w * 2; tint.height = h * 2;
      const tg = tint.getContext("2d"); tg.drawImage(img, 0, 0, w * 2, h * 2);
      tg.globalCompositeOperation = "source-in"; tg.fillStyle = color; tg.fillRect(0, 0, w * 2, h * 2);
      gg.shadowColor = color; gg.shadowBlur = 30; gg.drawImage(tint, 40, 40); gg.drawImage(tint, 40, 40);
      layout(); requestAnimationFrame(tick);
    }
    function layout() {
      const bw = box.clientWidth, bh = box.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
      cv.width = fv.width = (bw + PADX * 2) * dpr; cv.height = fv.height = (bh + PADT) * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const sc = Math.min(bw / img.naturalWidth, bh / img.naturalHeight), dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
      rect = { x: PADX + (bw - dw) / 2, y: PADT + bh - dh, w: dw, h: dh };
    }

      for (let i = 0; i < (strong ? 7 : (frame % 4 === 0 ? 1 : 0)); i++) {
        const e = edges[(Math.random() * edges.length) | 0], x = r.x + e[0] * r.w, y = r.y + e[1] * r.h;
        const out = Math.sign(e[0] - .5) || 1, life = 28 + Math.random() * 34;
        parts.push({ x, y, vx: out * (.3 + Math.random() * .9) + (Math.random() - .5) * .6, vy: -(1.6 + Math.random() * 3.2), life, max: life, s: 10 + Math.random() * 16 });
      }
      // the one behind bawls: twin fountains of tears arcing out of each eye, plus wet streaks down the cheeks
      if (!strong && eyes) {
        const ex = [[eyes[0], eyes[1], -1], [eyes[2], eyes[3], 1]];
        for (const [ex0, ey0, dir] of ex) {
          const x = r.x + ex0 * r.w, y = r.y + ey0 * r.h;
          if (frame % 2 === 0) sweat.push({ x, y, vx: dir * (1.4 + Math.random() * 1.6), vy: -1.6 - Math.random() * 1.2, life: 80, s: 3.5 + Math.random() * 2.5 });
        }
      }
      sweat = sweat.filter(d => (d.life -= 1) > 0 && d.y < H);
      tc.setTransform(1, 0, 0, 1, 0, 0); tc.clearRect(0, 0, W, H);
      const fd = Math.min(devicePixelRatio || 1, 2); tc.setTransform(fd, 0, 0, fd, 0, 0);
      tc.globalCompositeOperation = "source-over";
      if (!strong && eyes) {
        tc.globalAlpha = .55 + .15 * Math.sin(t * 9); tc.strokeStyle = "#8fdcff"; tc.lineWidth = Math.max(2.5, r.w * .008); tc.lineCap = "round";
        for (const [ex0, ey0, dir] of [[eyes[0], eyes[1], -1], [eyes[2], eyes[3], 1]]) {
          const x = r.x + ex0 * r.w, y = r.y + ey0 * r.h, len = r.h * .045;
          tc.beginPath(); tc.moveTo(x, y + 2); tc.quadraticCurveTo(x + dir * 3, y + len * .5, x + dir * 1, y + len); tc.stroke();
        }
      }
      for (const d of sweat) {
        d.vy += .22; d.x += d.vx; d.y += d.vy; d.vx *= .99;
        const a = Math.min(1, d.life / 25), ang = Math.atan2(d.vy, d.vx) - Math.PI / 2, sz = d.s;
        tc.save(); tc.translate(d.x, d.y); tc.rotate(ang); tc.globalAlpha = a;
        tc.fillStyle = "#5cc8ff"; tc.strokeStyle = "#0b3b5c"; tc.lineWidth = 1.2;
        tc.beginPath(); tc.moveTo(0, -sz * 2); tc.quadraticCurveTo(sz * 1.2, 0, 0, sz); tc.quadraticCurveTo(-sz * 1.2, 0, 0, -sz * 2); tc.fill(); tc.stroke();
        tc.fillStyle = "rgba(255,255,255,.85)"; tc.beginPath(); tc.arc(-sz * .3, -sz * .2, sz * .32, 0, 7); tc.fill();
        tc.restore();
      }
      tc.globalAlpha = 1;
      parts = parts.filter(q => (q.life -= 1) > 0);
      for (const q of parts) {
        q.x += q.vx; q.y += q.vy; q.vy *= .985; q.vx *= .97;
        const k = q.life / q.max, s = q.s * (.5 + k * .7);
        ctx.globalAlpha = k * .55; ctx.drawImage(flame, q.x - s / 2, q.y - s, s, s * 2.1);
        if (k > .6) { ctx.globalAlpha = (k - .6) * 1.2; ctx.drawImage(core, q.x - s / 4, q.y - s / 2, s / 2, s); }
      }
      // lightning: a jagged bolt every few seconds, with a harder shake while it flashes
      if (strong && --nextBolt <= 0) {
        const e = edges[(Math.random() * edges.length) | 0];
        let x = r.x + e[0] * r.w, y = r.y + e[1] * r.h * .7; const pts = [[x, y]];
        for (let i = 0; i < 7; i++) { x += (Math.random() - .5) * 46; y -= 10 + Math.random() * 22; pts.push([x, y]); }
        bolt = { pts, life: 7 }; nextBolt = 100 + Math.random() * 200; box.classList.add("surge");
      }
      if (bolt) {
        ctx.globalAlpha = bolt.life / 7; ctx.globalCompositeOperation = "source-over";
        ctx.shadowColor = color; ctx.shadowBlur = 16; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.2; ctx.lineJoin = "round";
        ctx.beginPath(); bolt.pts.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.stroke();
        ctx.shadowBlur = 0;
        if (--bolt.life <= 0) { bolt = null; box.classList.remove("surge"); }
      }
      ctx.globalAlpha = 1;
    }
    addEventListener("resize", () => glow && layout());
    img.complete && img.naturalWidth ? prep() : img.addEventListener("load", prep, { once: true });
  });

  // Banter: the leader talks trash, whoever's behind makes excuses. Lines rotate with the live numbers.
  const RANKN = s => divLabel(s).replace(/^([A-Z])(\d)$/, (m, t, d) => ({ P: "Plat", E: "Emerald", G: "Gold", D: "Diamond", S: "Silver", B: "Bronze", I: "Iron" }[t] || t) + " " + d);
  const TALK = {
    any: ["{gap} LP ahead and I'm not even trying.", "Emerald is {togo} LP away. Packing my bags.", "Is that your rank or your ping, {them}?", "Watch and learn, {them}. Actually, just watch.", "I'd wait for you at Emerald. I won't, but I'd think about it.", "Imagine being {gap} LP behind me. Couldn't be me.", "Thanks for the LP, {them}. Very generous.", "Say hi to {themRank} for me.", "You're not hardstuck, {them}. You're just stuck. Hard.", "Every game you lose, an angel gets my LP.", "I've seen better climbs on a flat road, {them}.", "{themTogo} LP to go? Bring snacks. And a will to live.", "Your MMR called. It's embarrassed.", "Don't worry, {them}. {themRank} is lovely this time of year.", "I'm carrying so hard my back hurts.", "Check the bars, {them}. Mine's the long one.", "Ranked is a race and you brought a shopping trolley.", "Holy shit, {them}, are you even queueing?", "Get your ass out of {themRank} and maybe we'll talk.", "I'd say gg, but that implies you played.", "Emerald's got a seat with my name on it. Yours says 'eventually'.", "You keep losing LP like it owes you money.", "Your op.gg looks like a crime scene, {them}.", "{gap} LP. That's not a gap, that's a canyon.", "Keep coping, {them}. It's free.", "Imagine needing {themTogo} LP. Damn.", "I'll send you a postcard from Emerald.", "Look at my bar. Now look at yours. Now back to mine.", "My worst game is your highlight reel.", "Queue up, {them}. I could use the LP.", "This isn't a race anymore. It's a victory lap.", "You call that a climb? That's a fucking stroll.", "Enjoy the view of my ass from {themRank}.", "Every time you hit Find Match, my LP goes up.", "{them}, your win rate is a coin flip and you keep calling tails.", "Ranked anxiety? Never heard of her.", "Emerald by the weekend. You by next season. Maybe.", "Bro is speedrunning back to Plat 4.", "I'd tilt you, but you're already horizontal.", "Don't blame your team, {them}. Blame your hands.", "Uninstall? Nah, stay. I need the LP.", "Hear that? That's {themRank} calling you home.", "I'm not your rival, {them}. I'm your ceiling.", "You play like your monitor's off.", "Damn, {them}, even the bots are worried about you.", "I'm built different. You're built in {themRank}.", "Keep feeding, {them}. Daddy's hungry.", "Honestly impressive how much LP you've donated.", "Your LP graph looks like my heart rate when I'm bored.", "I'd give you tips, but I don't do charity.", "Couldn't climb a ladder if it was lying flat, could you {them}?", "Sweaty? Nah, that's just the smell of winning.", "Get good. Or don't. Either way, I win.", "I'm one win streak away from never talking to you again.", "Even the Oracle doesn't believe in you, {them}.", "That's a nice little climb you've got there. Shame about the slide.", "Rent's due in {themRank}, {them}. Better pay up.", "Bitch, I'm {gap} LP ahead. Sit down.", "You're the reason they made surrender at 15.", "I'd race you, but you'd need to start moving first.", "My LP goes up, your excuses go up. We're both climbing."],
    Fiora: ["Riposte. Parried your whole season.", "Four vitals and zero respect, {them}.", "En garde? You're barely on guard.", "Grand Challenge? You're not even a small one.", "I proc'd all four of your vitals and your LP.", "Fiora top, you bottom. Of the race.", "My sword's sharper than your macro."],
    Lissandra: ["Ice cold. Like your win rate, {them}.", "Frozen in {themRank}? Must be my ult.", "I'd entomb you, but you're already stuck.", "Bow before the Ice Witch, peasant.", "My claws are cold. Your LP is colder.", "Frozen Tomb on myself and I'm still climbing faster than you.", "Glacial Path straight past your ass to Emerald."]
  };
  const BEG = {
    any: ["My jungler was literally AFK.", "It's the ping. OCE servers, man.", "I was playing off-role, okay?", "Matchmaking keeps giving me 4 Iron teammates.", "I'm just warming up. Ten more games.", "That last game doesn't count, my mouse died.", "I'm letting you win. It's a strategy.", "...can we not talk about LP right now?", "{gap} LP is like two games. Relax.", "I'll grind tonight. For real this time.", "My support was a smurf. On the enemy team.", "The sun was in my eyes. Indoors.", "I had a lag spike. For the whole game.", "Riot's matchmaking hates me specifically.", "My keyboard's sticky. Don't ask why.", "I'm saving my LP for later.", "Loser's queue, man. Seven games of it.", "I was trying a new build. It was dogshit.", "My team fed. I was perfect.", "My cat walked on the keyboard. Twice.", "It's not a loss streak, it's a character arc.", "I'm one game away from a heater. I can feel it.", "Honestly, my mid laner should be banned.", "Who even cares about Emerald? ...me. I care.", "Bro, I'm playing on a laptop.", "I was eating dinner. Don't count those.", "My internet is absolute ass.", "The patch fucked my champ.", "I don't have time to grind like you. I have a life.", "I peaked, okay? This is the decline.", "Please stop looking at the bars.", "Keep it down, {them}. I'm concentrating.", "At least I'm having fun. Sort of. Not really.", "My duo abandoned me.", "I'm still in placements mentally.", "Wait till I'm actually trying.", "{themRank} is overrated anyway.", "These are practice games. Ranked ones. For practice.", "I got jumped by five people. Every game.", "I'm not crying, the screen's just bright.", "My hands are cold, man. Literally shaking.", "Shit team, shit luck, shit everything.", "You got lucky, {them}. Like ninety games of lucky.", "I'll catch up. Probably. Maybe. Shit.", "The enemy jungler camped me. Every. Single. Game.", "Can't climb with these clowns.", "I play for the love of the game, not LP. ...okay, LP too.", "I'm sandbagging so the Oracle looks stupid.", "Mum called me for dinner mid-teamfight.", "My chair was uncomfortable, it threw me off.", "I hit Flash. Into the wall. That's the game's fault.", "There was a spider. A big one. Lost focus.", "Look, {gap} LP is a rounding error.", "My screen was upside down for like three games.", "That wasn't me playing, that was my little brother.", "I was in a call. Concentrating on the call. Obviously.", "Stop flexing, {them}, it's weird.", "I'm building character. And losing LP. Mostly the second one.", "Riot owes me like 200 LP at this point.", "My teammates are a war crime.", "I'll be fine. I'm fine. Everything is fine.", "God damn it. Not again.", "Honestly the ladder is rigged."],
    Fiora: ["Fiora's not broken anymore, that's why.", "They keep banning Fiora. Not my fault.", "My vitals were on the wrong side. All game.", "I parried. The wrong thing. Every time.", "Fiora's a skill champ. The skill is losing, apparently."],
    Lissandra: ["Lissandra got nerfed, I swear.", "Mid is the hardest role, you wouldn't get it.", "I ulted myself by accident. Five times.", "My E went over the wall. Without me.", "The ice was slippery, okay?"]
  };
  const fill = (t, me, them) => t.replace(/\{gap\}/g, gap).replace(/\{togo\}/g, Math.max(0, GOAL - me.score))
    .replace(/\{them\}/g, them.name.split(" ")[0]).replace(/\{themRank\}/g, RANKN(them.score))
    .replace(/\{themTogo\}/g, Math.max(0, GOAL - them.score));
  const bags = new Map();
  function pick(bank, champ) {
    const key = (bank === TALK ? "t:" : "b:") + champ;
    let bag = bags.get(key);
    if (!bag || !bag.length) {
      bag = bank.any.concat(bank[champ] || []);
      for (let i = bag.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [bag[i], bag[j]] = [bag[j], bag[i]]; }
      bags.set(key, bag);
    }
    return bag.pop();
  }
  const bubbleOf = p => $(p.side === "blue" ? "bubble-blue" : "bubble-red");
  function say(p, text, meek) {
    const b = bubbleOf(p);
    b.style.setProperty("--side", SIDE[p.side]); b.classList.toggle("meek", meek);
    b.innerHTML = `<span class="who">${esc(p.name)}</span>${esc(text)}`;
    b.classList.add("show");
    $("banter").style.setProperty("--side", SIDE[p.side]);
    $("banter").innerHTML = `<b>${esc(p.name)}:</b> “${esc(text)}”`;
  }
  const hush = () => document.querySelectorAll(".bubble").forEach(b => b.classList.remove("show"));
  function exchange() {
    if (winner || !P.every(p => p.tier !== "Unranked")) return;
    const talker = gap === 0 ? P[(Math.random() * 2) | 0] : lead, other = P.find(p => p !== talker);
    hush();
    setTimeout(() => say(talker, fill(pick(TALK, talker.main), talker, other), false), 300);
    setTimeout(() => say(other, fill(gap === 0 ? pick(TALK, other.main) : pick(BEG, other.main), other, talker), gap !== 0), 4500);
    setTimeout(hush, 12500);
  }
  exchange(); setInterval(exchange, 14000);

  $("footer").insertAdjacentHTML("beforeend", `<p class="legal">First to Emerald isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games or anyone officially involved in producing or managing Riot Games properties. Riot Games, and all associated properties are trademarks or registered trademarks of Riot Games, Inc.</p>`);
})();
