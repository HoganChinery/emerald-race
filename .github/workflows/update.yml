name: Update LP

on:
  schedule:
    - cron: "7,37 * * * *"     # every 30 min, off the busy :00/:30 marks
  workflow_dispatch:
    inputs:
      force_prediction:
        description: "Make a new AI prediction even if one ran recently"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape op.gg
        id: scrape
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python3 update.py
      - name: AI prediction
        id: predict
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_PREDICTION: ${{ inputs.force_prediction }}
        run: |
          pip install -q anthropic
          python3 predict.py || echo "::warning::prediction failed; keeping the previous one"
      - name: Commit when LP or prediction changed
        if: steps.scrape.outputs.changed == 'true' || steps.predict.outputs.predicted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html img
          git commit -m "LP update" && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
